<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <!-- Background -->
  <rect width="400" height="400" rx="30" fill="#111216"/>
  
  <!-- Outer Tech Ring (Scope) -->
  <circle cx="200" cy="200" r="130" fill="none" stroke="#2a2d38" stroke-width="4" />
  <circle cx="200" cy="200" r="120" fill="none" stroke="#00e5ff" stroke-width="2" stroke-dasharray="10 15" opacity="0.6"/>
  
  <!-- Sniper Crosshair Ticks -->
  <!-- Top/Bottom -->
  <line x1="200" y1="40" x2="200" y2="120" stroke="#00e5ff" stroke-width="3" stroke-linecap="round"/>
  <line x1="200" y1="280" x2="200" y2="360" stroke="#00e5ff" stroke-width="3" stroke-linecap="round"/>
  <!-- Left/Right -->
  <line x1="40" y1="200" x2="120" y2="200" stroke="#00e5ff" stroke-width="3" stroke-linecap="round"/>
  <line x1="280" y1="200" x2="360" y2="200" stroke="#00e5ff" stroke-width="3" stroke-linecap="round"/>
  
  <!-- The "Logging" Bracket Framing -->
  <path d="M 150,160 L 140,160 L 140,240 L 150,240" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
  <path d="M 250,160 L 260,160 L 260,240 L 250,240" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Target Locked Log Node (Center) -->
  <circle cx="200" cy="200" r="12" fill="#ff3366" />
  <circle cx="200" cy="200" r="25" fill="none" stroke="#ff3366" stroke-width="2" stroke-dasharray="4 4">
    <animateTransform 
      attributeName="transform" 
      type="rotate" 
      from="0 200 200" 
      to="360 200 200" 
      dur="10s" 
      repeatCount="indefinite"/>
  </circle>
  
  <!-- Subtle Grid Lines (Agent/Data Vibe) -->
  <line x1="100" y1="100" x2="300" y2="100" stroke="#2a2d38" stroke-width="1" stroke-dasharray="5 5"/>
  <line x1="100" y1="300" x2="300" y2="300" stroke="#2a2d38" stroke-width="1" stroke-dasharray="5 5"/>
  <line x1="100" y1="100" x2="100" y2="300" stroke="#2a2d38" stroke-width="1" stroke-dasharray="5 5"/>
  <line x1="300" y1="100" x2="300" y2="300" stroke="#2a2d38" stroke-width="1" stroke-dasharray="5 5"/>
</svg>
