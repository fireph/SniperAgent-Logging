sources:
  docker_logs:
    type: docker_logs
    docker_host: "unix:///var/run/docker.sock"
  pfsense_syslog:
    type: syslog
    mode: udp
    address: "0.0.0.0:1514"

transforms:
  tag_source:
    type: remap
    inputs:
      - docker_logs
      - pfsense_syslog
    source: |
      if .source_type == "docker" {
        .log_source = "docker"
      } else {
        .log_source = "pfsense"
      }

sinks:
  log_file:
    type: file
    inputs:
      - tag_source
    path: "/data/logs/sniper-%Y-%m-%d.jsonl"
    encoding:
      codec: json
